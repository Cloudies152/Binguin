name: 编译与打包
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 验证 Debug 构建
        shell: pwsh
        run: ./Source/build.ps1 -Configuration Debug -OutputRoot "$env:RUNNER_TEMP/BinguinDebug"
      - name: 构建并打包 Release
        shell: pwsh
        run: ./package_modSelf.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Binguin-1.7
          path: dist/Binguin
          if-no-files-found: error
